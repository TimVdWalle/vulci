# Phase 12

name: Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run formatting, linting, type checks, and tests
        run: npm run check

      - name: Run coverage
        shell: bash
        run: |
          set +e
          npm run coverage 2>&1 | tee coverage.txt
          coverage_status=${PIPESTATUS[0]}
          set -e

          {
            echo "## Test coverage"
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$coverage_status"